pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      glob: "*.{js,jsx,ts,tsx,astro,css,json,jsonc,md,yml,yaml}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    - name: oxlint
      glob: "*.{js,jsx,ts,tsx,astro}"
      run: pnpm exec oxlint {staged_files}
    - name: typecheck
      glob: "*.{ts,tsx,astro}"
      run: pnpm run typecheck
